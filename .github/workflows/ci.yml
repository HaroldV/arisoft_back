name: Backend CI & Quality Gate

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  security-and-quality:
    name: Backend Quality Gate (Security, Tests, Build & Health Probe)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 2. TypeScript Strict Typecheck & Code Standards
        run: npm run lint

      - name: 3. Run Unit & Multi-Tenant Tests
        env:
          NODE_ENV: test
          DB_HOST: ${{ secrets.CI_DB_HOST }}
          DB_PORT: ${{ secrets.CI_DB_PORT }}
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm test -- --coverage --maxWorkers=2

      - name: 4. Build Production Bundle
        run: npm run build

      - name: 5. Zero-Downtime Health Probe Check
        env:
          PORT: ${{ vars.PORT }}
          NODE_ENV: production
          DB_HOST: ${{ secrets.CI_DB_HOST }}
          DB_PORT: ${{ secrets.CI_DB_PORT }}
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          PROBE_PORT="${PORT:-8080}"
          node dist/main.js &
          SERVER_PID=$!
          echo "Waiting for server startup on port $PROBE_PORT (PID: $SERVER_PID)..."
          
          # Poll health endpoint up to 30 seconds
          for i in {1..30}; do
            if curl -s -f "http://127.0.0.1:$PROBE_PORT/health" > /dev/null; then
              echo "✅ Health check probe succeeded on http://127.0.0.1:$PROBE_PORT/health!"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          
          echo "❌ Health check probe timed out after 30 seconds."
          kill $SERVER_PID || true
          exit 1
