name: Backend CI & Quality Gate

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  security-and-quality:
    name: Backend Quality Gate (Security, Tests, Build & Health Probe)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ari_admin
          POSTGRES_PASSWORD: ari_password_2026
          POSTGRES_DB: ari_erp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 2. ESLint Code Standards
        run: npm run lint

      - name: 3. Run Unit & Multi-Tenant Tests
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: ari_admin
          DB_PASSWORD: ari_password_2026
          DB_NAME: ari_erp_db
          JWT_SECRET: ci-pipeline-test-secret-key-12345
        run: npm test -- --coverage --maxWorkers=2

      - name: 4. Build Production Bundle
        run: npm run build

      - name: 5. Zero-Downtime Health Probe Check
        env:
          PORT: 8080
          NODE_ENV: production
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: ari_admin
          DB_PASSWORD: ari_password_2026
          DB_NAME: ari_erp_db
          JWT_SECRET: ci-pipeline-test-secret-key-12345
        run: |
          node dist/main.js &
          SERVER_PID=$!
          echo "Waiting for server startup on port 8080 (PID: $SERVER_PID)..."
          
          # Poll health endpoint up to 30 seconds
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8080/health > /dev/null; then
              echo "✅ Health check probe succeeded on http://127.0.0.1:8080/health!"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          
          echo "❌ Health check probe timed out after 30 seconds."
          kill $SERVER_PID || true
          exit 1
