name: Backend Quality Gates & CI

on:
  push:
    branches: [ develop, main, "feature/**" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  quality-gates:
    name: Clean Code, Architecture & Tests Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: "Quality Gate 1: Strict Architecture Guard (No Raw SQL / dataSource.query in App Code)"
        run: |
          echo "🔍 Checking for prohibited dataSource.query or raw SQL antipatterns in application layer..."
          FORBIDDEN_MATCHES=$(grep -rn --include="*.ts" "dataSource\.query" src/application src/presentation src/domain || true)
          if [ -n "$FORBIDDEN_MATCHES" ]; then
            echo "❌ Architecture Quality Gate Failed: Raw 'dataSource.query' found in application layers:"
            echo "$FORBIDDEN_MATCHES"
            echo "👉 Rule 6.6 of AGENTS.md strictly prohibits raw SQL in UseCases, Controllers and Domain entities. Use TypeORM Repositories."
            exit 1
          fi
          echo "✅ Strict Architecture Guard Passed (0 prohibited raw query occurrences)."

      - name: "Quality Gate 2: Strict Typecheck"
        run: npm run lint

      - name: "Quality Gate 3: Unit & Integration Test Suite"
        run: npm test

      - name: "Quality Gate 4: Production Build Gate"
        run: npm run build
