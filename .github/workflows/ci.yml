name: Backend Quality Gates & CI

on:
  push:
    branches: [ develop, main, "feature/**" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  quality-gates:
    name: Clean Code, Architecture & Tests Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: "Install Dependencies"
        run: npm install

      - name: "Quality Gate 1: Strict Architecture Guard (No Raw SQL / dataSource.query in App Code)"
        run: |
          echo "🔍 Checking for prohibited dataSource.query or raw SQL antipatterns in application layer..."
          FORBIDDEN_MATCHES=$(grep -rn --include="*.ts" "dataSource\.query" src/application src/presentation src/domain || true)
          if [ -n "$FORBIDDEN_MATCHES" ]; then
            echo "❌ Architecture Quality Gate Failed: Raw 'dataSource.query' found in application layers:"
            echo "$FORBIDDEN_MATCHES"
            echo "👉 Rule 6.6 of AGENTS.md strictly prohibits raw SQL in UseCases, Controllers and Domain entities. Use TypeORM Repositories."
            exit 1
          fi
          echo "✅ Strict Architecture Guard Passed (0 prohibited raw query occurrences)."

      - name: "Quality Gate 1.1: Migration Security Guard (No Hardcoded Credentials or DML in Migrations)"
        run: |
          echo "🔍 Checking for prohibited user credentials, password hashes or DML in SQL migrations..."
          FORBIDDEN_SQL=$(grep -rnE --include="*.sql" "INSERT INTO users|password_hash|UPDATE users" src/infrastructure/persistence/typeorm/migrations/ || true)
          if [ -n "$FORBIDDEN_SQL" ]; then
            echo "❌ Security Quality Gate Failed: Found user credentials or DML in migrations:"
            echo "$FORBIDDEN_SQL"
            echo "👉 Rule 8.1 of AGENTS.md strictly requires DDL-only migrations. User bootstrapping must be done dynamically in code with env vars."
            exit 1
          fi
          echo "✅ Migration Security Guard Passed (0 hardcoded credentials or DML queries)."

      - name: "Quality Gate 1.2: Magic Strings Guard (No Hardcoded Role Comparisons in Backend)"
        run: |
          echo "🔍 Checking for hardcoded UserRole string comparisons (Rule 6.1)..."
          FORBIDDEN_ROLES=$(grep -rnE --include="*.ts" "role\s*(===|!==)\s*['\"](SUPER_ADMIN|OWNER|MANAGER|CASHIER)['\"]" src/application src/presentation || true)
          if [ -n "$FORBIDDEN_ROLES" ]; then
            echo "❌ Quality Gate Failed: Found hardcoded role string comparisons:"
            echo "$FORBIDDEN_ROLES"
            echo "👉 Rule 6.1 of AGENTS.md strictly prohibits magic strings. Use UserRole enum (e.g. UserRole.SUPER_ADMIN, UserRole.OWNER)."
            exit 1
          fi
          echo "✅ Magic Strings Role Guard Passed (0 hardcoded role comparisons)."

      - name: "Quality Gate 2: Strict Typecheck"
        run: npm run lint

      - name: "Quality Gate 3: Unit & Integration Test Suite"
        run: npm test

      - name: "Quality Gate 4: Production Build Gate"
        run: npm run build
